; altcha
mautic.form.field.type.plugin.altcha="ALTCHA"
strings.altcha.plugin.name="ALTCHA"
strings.altcha.failure_message="ALTCHA verification wasn't successful. Please try again."

strings.altcha.settings.notice="Fill in EITHER the HMAC Secret (self-hosted, runs entirely on this server) OR the three Sentinel fields below (uses an ALTCHA Sentinel instance). If both are filled in, Sentinel takes priority."

strings.altcha.settings.hmac_secret="HMAC Secret (self-hosted)"
strings.altcha.settings.hmac_secret.notice="A long, random string (e.g. from `openssl rand -hex 32`) that Mautic uses to sign and verify challenges locally. ALTCHA never makes an outbound request to any third party. Leave blank to keep the current value."
strings.altcha.settings.hmac_secret.placeholder="Leave blank to keep the current secret unchanged"

strings.altcha.settings.sentinel_domain="Sentinel Domain / Base URL"
strings.altcha.settings.sentinel_domain.notice="Your ALTCHA Sentinel instance's base URL, e.g. https://sentinel.example.com. Do not include a trailing slash."

strings.altcha.settings.sentinel_api_key="Sentinel API Key"
strings.altcha.settings.sentinel_api_key.notice="The API Key ID from your Sentinel app's API Keys section (looks like key_...). Sent to the visitor's browser as part of the widget's challenge URL."

strings.altcha.settings.sentinel_api_secret="Sentinel API Key Secret"
strings.altcha.settings.sentinel_api_secret.notice="The Secret for the same API Key. Never leaves your server - used only to verify Sentinel's server signature locally. Leave blank to keep the current value."
strings.altcha.settings.sentinel_api_secret.placeholder="Leave blank to keep the current secret unchanged"

strings.altcha.settings.complexity="Complexity"
strings.altcha.settings.complexity.tooltip="Self-hosted mode only. How much proof-of-work the visitor's browser must compute. Higher = more spam resistance but slightly slower on low-end devices."
strings.altcha.settings.complexity.option.low="Low"
strings.altcha.settings.complexity.option.medium="Medium"
strings.altcha.settings.complexity.option.high="High"

strings.altcha.settings.expire="Challenge expiry (seconds)"
strings.altcha.settings.expire.tooltip="Self-hosted mode only. How long a generated challenge stays valid. If a visitor takes longer than this to submit, they must solve a new challenge."

strings.altcha.settings.auto="Start solving"
strings.altcha.settings.auto.tooltip="When the widget should start solving the challenge. \"On submit\" avoids wasting CPU if the visitor never submits; \"On page load\" solves it in the background for instant submission; \"Off\" requires a manual checkbox tick."
strings.altcha.settings.auto.option.onload="On page load"
strings.altcha.settings.auto.option.onsubmit="On submit"
strings.altcha.settings.auto.option.off="Off (manual)"

strings.altcha.settings.display="Display mode"
strings.altcha.settings.display.tooltip="How the widget is laid out. Standard is an inline box; Bar is a slim bar; Floating attaches a badge near the submit button; Overlay opens a modal when needed; Invisible shows no UI unless a code challenge is required."
strings.altcha.settings.display.option.standard="Standard (inline box)"
strings.altcha.settings.display.option.bar="Bar"
strings.altcha.settings.display.option.floating="Floating"
strings.altcha.settings.display.option.overlay="Overlay"
strings.altcha.settings.display.option.invisible="Invisible"

strings.altcha.settings.hide_footer="Hide footer"
strings.altcha.settings.hide_logo="Hide ALTCHA logo"
