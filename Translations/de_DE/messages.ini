; altcha
mautic.form.field.type.plugin.altcha="ALTCHA"
strings.altcha.plugin.name="ALTCHA"
strings.altcha.failure_message="ALTCHA-Verifizierung war nicht erfolgreich. Bitte versuchen Sie es erneut."

strings.altcha.settings.notice="Füllen Sie ENTWEDER das HMAC-Secret (selbst gehostet, läuft vollständig auf diesem Server) ODER die drei Sentinel-Felder unten aus (verwendet eine ALTCHA-Sentinel-Instanz). Wenn beide ausgefüllt sind, hat Sentinel Vorrang."

strings.altcha.settings.hmac_secret="HMAC-Secret (selbst gehostet)"
strings.altcha.settings.hmac_secret.notice="Eine lange, zufällige Zeichenkette (z. B. aus `openssl rand -hex 32`), die Mautic verwendet, um Challenges lokal zu signieren und zu verifizieren. ALTCHA stellt keine ausgehende Anfrage an Dritte. Leer lassen, um den aktuellen Wert beizubehalten."
strings.altcha.settings.hmac_secret.placeholder="Leer lassen, um das aktuelle Secret unverändert zu behalten"

strings.altcha.settings.sentinel_domain="Sentinel-Domain / Basis-URL"
strings.altcha.settings.sentinel_domain.notice="Die Basis-URL Ihrer ALTCHA-Sentinel-Instanz, z. B. https://sentinel.example.com. Kein abschließender Schrägstrich."

strings.altcha.settings.sentinel_api_key="Sentinel API-Schlüssel"
strings.altcha.settings.sentinel_api_key.notice="Die API-Schlüssel-ID aus dem Bereich API-Schlüssel Ihrer Sentinel-App (sieht aus wie key_...). Wird als Teil der Challenge-URL des Widgets an den Browser des Besuchers übermittelt."

strings.altcha.settings.sentinel_api_secret="Sentinel API-Schlüssel-Secret"
strings.altcha.settings.sentinel_api_secret.notice="Das Secret für denselben API-Schlüssel. Verlässt Ihren Server nie – wird nur zur lokalen Überprüfung der Sentinel-Server-Signatur verwendet. Leer lassen, um den aktuellen Wert beizubehalten."
strings.altcha.settings.sentinel_api_secret.placeholder="Leer lassen, um das aktuelle Secret unverändert zu behalten"

strings.altcha.settings.complexity="Schwierigkeitsgrad"
strings.altcha.settings.complexity.tooltip="Nur im selbst gehosteten Modus. Wie viel Proof-of-Work der Browser des Besuchers berechnen muss. Höher = mehr Spam-Schutz, aber etwas langsamer auf schwachen Geräten."
